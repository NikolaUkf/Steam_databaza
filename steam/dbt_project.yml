name: 'steam'
version: '1.0.0'


profile: 'steam'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:  
  bronze_schema: bronze


models:
  steam:
    staging:
          +materialized: view
          +schema: silver
    marts:
          +materialized: table
          +schema: gold
    reporting:
          +materialized: view
          +schema: reporting
